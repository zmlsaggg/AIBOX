name: Build desktop and Android releases

on:
  workflow_call:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build web app
        run: npm run build
      - name: Package Windows installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: aibox-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aibox-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    # Pull requests only build artifacts. Main-branch builds and v* tags publish releases.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: aibox-windows-x64
          path: release-assets/windows
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: aibox-android-apk
          path: release-assets/android
      - name: Publish release with binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('aibox-build-{0}', github.run_id) }}
          target_commitish: ${{ github.sha }}
          name: "${{ startsWith(github.ref, 'refs/tags/v') && format('AIBOX {0}', github.ref_name) || format('AIBOX CI build #{0}', github.run_number) }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          files: |
            release-assets/windows/*.exe
            release-assets/android/*.apk
