name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Electron main and preload syntax
        run: node --check electron/main.cjs && node --check electron/preload.cjs
      - name: Typecheck and production build
        run: npm run build

  platform-builds:
    name: Windows and Android packages
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: write

  godot-native:
    name: Godot 4.7.2 native project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js for GLB compatibility conversion
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install GLB conversion dependencies
        run: npm install
      - name: Setup Godot 4.7.2 Stable
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Verify Godot version
        run: godot --version
      - name: Download pinned CC0 character models
        run: bash godot/scripts/download_assets.sh
      - name: Verify character assets
        run: test -s godot/assets/characters/guard_dog_walker.glb && test -s godot/assets/characters/prisoner_casual_walker.glb
      - name: Import and parse native project
        run: godot --headless --path godot --editor --quit
      - name: Verify rigged character assets
        run: godot --headless --path godot --script res://scripts/asset_smoke_test.gd
      - name: Run native project smoke test
        run: godot --headless --path godot --quit-after 5 --log-file godot-smoke.log
      - name: Fail on script or runtime errors
        if: always()
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Cannot|AIBOX NAVIGATION SMOKE FAILED" godot-smoke.log; then
            exit 1
          fi
